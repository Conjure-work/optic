# The whole suite on every pull request and every push to main (added 2026-11-09).
#
# - suite: the Python tests and the browser journeys (tests/e2e) on Ubuntu (since 2026-11-24). About a thousand of
#   the tests run the front end's modules in JavaScriptCore; Ubuntu's libjavascriptcoregtk-bin installs it as
#   /usr/bin/jsc and tests/support/jsc.py finds it. They ran on macOS before, and GitHub's macOS arm64 capacity kept
#   cancelling jobs before a runner took them, so no run on the deployed build had completed. Outbound HTTP is pinned
#   to a closed local port, so no test can reach a real provider; Anthropic is a recording stub. It runs as eleven
#   parallel shards (tests/support/shards.py), each with its own floor.
# - count: adds the shards' counts together, writes them to the run's summary, and fails below SUITE_FLOOR or on any
#   skip other than the known one (tests/support/ci_count.py KNOWN_SKIPS).
# - image: builds the Dockerfile, as a deploy does.
# - secrets: gitleaks over the full history, with .gitleaks.toml's allowlist (storage key names, test fixtures).
name: tests

on:
  pull_request:
  push:
    # main, and the branches a pull request from a fork is built on (so the run shows on the fork before review)
    branches: [main, "factory/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # the suite's floor: the sum of the shards' floors in tests/support/shards.py (SHARD_FLOORS), checked by
  # tests/test_ci_shards.py. Lower it only with a reason in the pull request.
  SUITE_FLOOR: "9605"

jobs:
  # The suite in parallel shards (2026-11-23): as one job it took about 33 minutes on a fast Mac and timed out at 40
  # on GitHub's shared macOS runner (Ubuntu since 2026-11-24). `py` is every Python file (about five minutes); the browser journeys are dealt
  # round-robin into six slices so the slowest file is shared out. Which test runs where: tests/support/shards.py.
  suite:
    runs-on: ubuntu-latest
    # a journey slice measured 15 to 21 minutes on the runner with ten slices' worth of work in six; 45 leaves room
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [py, e2e-1, e2e-2, e2e-3, e2e-4, e2e-5, e2e-6, e2e-7, e2e-8, e2e-9, e2e-10]
    env:
      # Optic's dates are market dates in New York; the suite was written and is run there (a UTC runner after 7 pm
      # New York time put "in 12 days" a day out in tests/test_v2_parity_b6a.py)
      TZ: America/New_York
      # and in US English. JavaScriptCore's default number format follows the process locale: under C.UTF-8 (the
      # Ubuntu runner's default, and what Python coerces a bare C locale to) it is en-US-u-va-posix, which drops the
      # thousands separator, so toLocaleString() gave "7160248" where the Mac and every en-US browser give
      # "7,160,248" (tests/test_chart_first_layout.py, 2026-11-24)
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        # libjavascriptcoregtk-bin is the JavaScriptCore shell (/usr/bin/jsc); the step fails if the tests cannot
        # find it, rather than letting a thousand tests skip. --with-deps installs Chromium's system libraries.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libjavascriptcoregtk-bin
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          jsc_path="$(python -m tests.support.jsc)"
          echo "JavaScriptCore: $jsc_path"
          test -x "$jsc_path"
      - name: Tests
        # outbound HTTP pinned to a closed port, both spellings (curl reads the lowercase ones), set in the shell
        # because the workflow's env section treats the two spellings as one key
        run: |
          export HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost
          python -m pytest -q -p no:cacheprovider --junitxml=junit-$SHARD.xml $(python -m tests.support.shards $SHARD)
      - name: Count
        if: always()
        run: python -m tests.support.ci_count shard $SHARD junit-$SHARD.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml

  # The shards added together: the run fails unless every shard ran, nothing failed, nothing skipped but the known
  # skip, and the total passed is at least SUITE_FLOOR. The summary shows each shard's line, the total and every skip.
  count:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          pattern: junit-*
          merge-multiple: true
      - name: Total
        run: python -m tests.support.ci_count total .

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t optic:ci .
      - name: Start it and read /healthz
        run: |
          docker run -d --name optic -p 8077:8077 -e HTTPS_PROXY=http://127.0.0.1:9 -e HTTP_PROXY=http://127.0.0.1:9 optic:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8077/healthz && exit 0; sleep 2; done
          docker logs optic; exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks, full history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
